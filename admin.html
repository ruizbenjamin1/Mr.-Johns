<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. John's - Admin Staff</title>
    <!-- Bootstrap 5 & Iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="estilos_pro.css" rel="stylesheet">
</head>
<body style="background: radial-gradient(circle at center, #14141f 0%, #0b0b0e 100%) !important; color: #f8fafc;">

    <!-- NAVBAR SUPERIOR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary px-3 py-2">
        <div class="container-fluid">
            <span class="navbar-brand fw-bold text-warning"><i class="bi bi-shield-lock-fill me-2"></i>Admin</span>
            <div class="d-flex align-items-center gap-3">
                <button id="btn-logout" class="btn btn-outline-danger btn-sm"><i class="bi bi-box-arrow-right"></i> Salir</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4 px-3" style="padding-bottom: 60px;">
        
        <!-- BLOQUE 1: PLANILLA Y CONVOCATORIA DE MOZOS -->
        <div class="card card-admin p-3 mb-4 rounded-3 shadow-sm" style="background-color: #171722; border: 1px solid #2a2a3a;">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold mb-0 text-warning"><i class="bi bi-people-fill me-2"></i>Equipo Convocado para el Sábado</h5>
                <span class="badge bg-success">Turno 19:00 - 06:00</span>
            </div>

            <!-- LISTA DE MOZOS SELECCIONADOS CON SECTOR Y PROPINA -->
            <div class="mb-4">
                <h6 class="text-success fw-bold small text-uppercase mb-2"><i class="bi bi-star-fill me-1"></i> Asignación de Sectores y Propinas</h6>
                <div id="equipo-convocado-final">
                    <!-- JS inyectará acá las filas limpias con Sector y Propina individual -->
                </div>
            </div>

            <hr class="border-secondary opacity-25">

            <!-- DISPONIBILIDAD: POSTULANTES -->
            <div>
                <h6 class="text-muted fw-bold small text-uppercase mb-2"><i class="bi bi-person-lines-fill text-info me-1"></i> Mozos Disponibles para Convocar</h6>
                <div class="list-group" id="lista-mozos-confirmados"></div>
            </div>
            
            <div id="lista-pendientes" class="mt-3"></div>
        </div>

        <!-- BLOQUE 2: ALTA DE NUEVO USUARIO CON SELECCIÓN DE ROL -->
        <div class="card card-admin p-3 mb-4 rounded-3 shadow-sm" style="background-color: #171722; border: 1px solid #2a2a3a;">
            <h5 class="fw-bold mb-3 text-light"><i class="bi bi-person-plus-fill me-2"></i>Registrar Nuevo Usuario</h5>
            <form id="formAltaPersonal" class="row g-2">
                <div class="col-md-3">
                    <input type="text" id="new-name" class="form-control bg-dark text-light border-secondary" placeholder="Nombre" required>
                </div>
                <div class="col-md-3">
                    <input type="text" id="new-username" class="form-control bg-dark text-light border-secondary" placeholder="Usuario" required>
                </div>
                <div class="col-md-3">
                    <input type="password" id="new-password" class="form-control bg-dark text-light border-secondary" placeholder="Contraseña" required>
                </div>
                <div class="col-md-2">
                    <select id="new-role" class="form-select bg-dark text-light border-secondary" required>
                        <option value="" disabled selected>Seleccionar Rol</option>
                        <option value="mozo" selected>Mozo</option>
                        <option value="bartender">Bartender</option>
                        <option value="admin_barra">Jefe de Barra</option>
                    </select>
                </div>
                <div class="col-md-1">
                    <button type="submit" class="btn btn-warning w-100 fw-bold" title="Crear Usuario"><i class="bi bi-plus-lg"></i></button>
                </div>
            </form>
        </div>

        <!-- BLOQUE 3: GESTIÓN DE USUARIOS REGISTRADOS (CRUD) -->
        <div class="card card-admin p-3 rounded-3 shadow-sm" style="background-color: #171722; border: 1px solid #2a2a3a;">
            <h5 class="fw-bold mb-3 text-light"><i class="bi bi-gear-fill me-2"></i>Gestionar Usuarios Registrados</h5>
            <div class="table-responsive">
                <table class="table table-dark align-middle text-center mb-0" style="font-size: 0.9rem;">
                    <thead>
                        <tr>
                            <th>Nombre Real</th>
                            <th>Usuario</th>
                            <th>Contraseña</th>
                            <th>Rol</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-usuarios-crud">
                        <!-- Carga dinámica -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="admin.js"></script>
</body>
</html>
