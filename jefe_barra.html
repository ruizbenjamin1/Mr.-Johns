<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. John's - Jefe de Barra</title>
    <!-- Bootstrap 5 & Iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="estilos_pro.css" rel="stylesheet">

    <!-- Toastify JS (Notificaciones Flotantes) -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
</head>
<body style="background: radial-gradient(circle at center, #14141f 0%, #0b0b0e 100%) !important; color: #f8fafc;">

    <!-- NAVBAR SUPERIOR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary px-3 py-2">
        <div class="container-fluid">
            <span class="navbar-brand fw-bold text-info"><i class="bi bi-cup-straw me-2"></i>Jefe de Barra</span>
            <div class="d-flex align-items-center gap-3">
                <button id="btn-logout" class="btn btn-outline-danger btn-sm"><i class="bi bi-box-arrow-right"></i> Salir</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4 px-3" style="padding-bottom: 60px;">
        
        <!-- BLOQUE 1: PLANILLA Y CONVOCATORIA DE BARTENDERS POR DÍA -->
        <div class="card card-barra p-3 mb-4 rounded-3 shadow-sm" style="background-color: #171722; border: 1px solid #2a2a3a;">
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
                <h5 class="fw-bold mb-0 text-info"><i class="bi bi-cup-straw me-2"></i>Bartenders Convocados</h5>
                
                <!-- SELECTOR DE DÍA INTEGRADO -->
                <div class="d-flex align-items-center gap-2">
                    <span class="text-muted small fw-bold">Día:</span>
                    <select id="select-dia-gestion" class="form-select form-select-sm bg-dark text-info border-info fw-bold text-center" style="width: 140px;">
                        <option value="Lunes">Lunes</option>
                        <option value="Martes">Martes</option>
                        <option value="Miércoles">Miércoles</option>
                        <option value="Jueves">Jueves</option>
                        <option value="Viernes">Viernes</option>
                        <option value="Sábado" selected>Sábado</option>
                        <option value="Domingo">Domingo</option>
                    </select>
                </div>
            </div>

            <!-- LISTA DE BARTENDERS SELECCIONADOS CON SECTOR/PUESTO DE BARRA -->
            <div class="mb-4">
                <h6 class="text-info fw-bold small text-uppercase mb-2"><i class="bi bi-star-fill me-1"></i> Asignación de Puestos de Barra</h6>
                <div id="equipo-barra-final">
                    <!-- JS inyectará las filas de bartenders con selector de sector -->
                </div>
            </div>

            <hr class="border-secondary opacity-25">

            <!-- DISPONIBILIDAD: BARTENDERS POSTULADOS -->
            <div>
                <h6 class="text-muted fw-bold small text-uppercase mb-2"><i class="bi bi-person-lines-fill me-1"></i> Bartenders Disponibles para Convocar</h6>
                <div class="list-group" id="lista-bartenders-confirmados"></div>
            </div>
            
            <div id="lista-pendientes-barra" class="mt-3"></div>
        </div>

        <!-- BLOQUE 2: CONTROL DE PROPINAS POR SECTOR DE BARRA -->
        <div class="card card-barra p-3 mb-4 rounded-3 shadow-sm" style="background-color: #171722; border: 1px solid #2a2a3a;">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold mb-0 text-info"><i class="bi bi-cash-stack me-2"></i>Propinas Generadas por Sector</h5>
            </div>

            <div class="table-responsive">
                <table class="table table-dark align-middle text-center mb-0" style="font-size: 0.9rem;">
                    <thead>
                        <tr>
                            <th class="text-start ps-3">Sector de Barra</th>
                            <th>Monto Recaudado $</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-propinas-sectores-body">
                        <!-- JS inyectará dinámicamente las barras y sus inputs de propina -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- BLOQUE 3: REGISTRAR NUEVO BARTENDER -->
        <div class="card card-barra p-3 mb-4 rounded-3 shadow-sm" style="background-color: #171722; border: 1px solid #2a2a3a;">
            <h5 class="fw-bold mb-3 text-light"><i class="bi bi-person-plus-fill me-2"></i>Registrar Nuevo Bartender</h5>
            <form id="formAltaBartender" class="row g-2">
                <div class="col-md-4">
                    <input type="text" id="new-bartender-name" class="form-control bg-dark text-light border-secondary" placeholder="Nombre" required>
                </div>
                <div class="col-md-4">
                    <input type="text" id="new-bartender-username" class="form-control bg-dark text-light border-secondary" placeholder="Usuario" required>
                </div>
                <div class="col-md-3">
                    <input type="text" id="new-bartender-password" class="form-control bg-dark text-light border-secondary" placeholder="Contraseña" required>
                </div>
                <div class="col-md-1">
                    <button type="submit" class="btn btn-info w-100 fw-bold text-dark"><i class="bi bi-plus-lg"></i></button>
                </div>
            </form>
        </div>

        <!-- BLOQUE 4: GESTIÓN DE BARTENDERS REGISTRADOS (CRUD) -->
        <div class="card card-barra p-3 rounded-3 shadow-sm" style="background-color: #171722; border: 1px solid #2a2a3a;">
            <h5 class="fw-bold mb-3 text-light"><i class="bi bi-gear-fill me-2"></i>Gestionar Bartenders Registrados</h5>
            <div class="table-responsive">
                <table class="table table-dark align-middle text-center mb-0" style="font-size: 0.9rem;">
                    <thead>
                        <tr>
                            <th>Nombre Real</th>
                            <th>Usuario</th>
                            <th>Contraseña</th>
                            <th>Rol</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-bartenders-crud">
                        <!-- Carga dinámica -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- BOTÓN EXPORTAR CENTRADO -->
        <div class="text-center my-4 py-2">
            <button class="btn btn-info text-dark fw-bold px-4 py-2 shadow" onclick="exportarBarraA_GoogleSheets()">
                <i class="bi bi-file-earmark-excel me-2"></i>Exportar
            </button>
        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Supabase Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase_client.js"></script>
    <!-- Script del Jefe de Barra -->
    <script src="jefe_barra.js"></script>
</body>
</html>
