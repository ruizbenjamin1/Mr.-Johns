<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Aplica el tema guardado ANTES de pintar la página, para que no se vea
         un flash del tema incorrecto al cargar. -->
    <script>
        (function () {
            if (localStorage.getItem('temaMrJohns') === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Johns</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Tu CSS Premium -->
    <link href="estilos_pro.css" rel="stylesheet">

    <!-- Toastify JS (Notificaciones Flotantes) -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    
    <style>
        .card-login {
            max-width: 400px;
            width: 100%;
        }

        .logo-container {
            display: inline-block;
            margin-bottom: 1rem;
            border-radius: 12px;
            overflow: hidden;
        }
        
        .logo-img {
            max-width: 200px;
            height: auto;
            /* El filtro/blend que invierte el logo a blanco en tema oscuro vive
               en estilos_pro.css (var(--logo-filter)/var(--logo-blend)), así
               reacciona solo al cambiar de tema. */
            transition: transform 0.3s ease;
        }

        .card-login:hover .logo-img {
            transform: scale(1.03);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100 fondo-radial">

    <button id="btn-toggle-tema" type="button" class="btn btn-sm btn-toggle-tema position-fixed top-0 end-0 m-3" title="Cambiar tema">
        <i class="bi bi-sun-fill"></i>
    </button>

    <div class="container d-flex justify-content-center px-3">
        <div class="card card-custom p-4 shadow-lg card-login">
            <div class="text-center mb-4">
                <!-- Contenedor del Logo sin recuadro feo -->
                <div class="logo-container">
                    <img src="logo.png" alt="Mr. John's Logo" class="logo-img">
                </div>
                <p class="text-muted small">Ingresá tus credenciales para acceder al sistema</p>
            </div>
            
            <!-- Formulario del Login -->
            <form id="formLogin">
                <div class="mb-3">
                    <!-- Cambiado a text-light -->
                    <label for="username" class="form-label text-light small fw-semibold">Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-light"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control bg-dark text-light border-secondary" id="username" placeholder="" required>
                    </div>
                </div>
                
                <div class="mb-4">
                    <!-- Cambiado a text-light -->
                    <label for="password" class="form-label text-light small fw-semibold">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-light"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control bg-dark text-light border-secondary" id="password" placeholder="" required>
                    </div>
                </div>
                
                <button type="submit" id="btn-login-submit" class="btn btn-custom w-100 py-2 shadow-sm text-dark">
                    ENTRAR
                </button>
            </form>
        </div>
    </div>

  <!-- 1. Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 2. CDN Oficial de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 3. Tu cliente de conexión a Supabase -->
    <script src="supabase_client.js"></script>
    
    <!-- 4. Lógica de tu pantalla (solo una vez y al final)  -->
    <script src="app.js"></script>
</body>
</html>
