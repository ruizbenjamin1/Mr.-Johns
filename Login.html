<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. John's - Login</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Tu CSS Premium -->
    <link href="estilos_pro.css" rel="stylesheet">
    
    <style>
        .card-login {
            max-width: 400px;
            width: 100%;
        }

        .logo-container {
            display: inline-block;
            margin-bottom: 1rem;
            border-radius: 12px;
            overflow: hidden;
        }
        
        .logo-img {
            max-width: 200px;
            height: auto;
            /* 1. Invertimos para que las letras sean blancas y el fondo negro */
            filter: invert(1) brightness(1.2); 
            /* 2. SOLUCIÓN: Hace que el fondo negro del cuadrado sea invisible y se fusione con la tarjeta */
            mix-blend-mode: screen; 
            transition: transform 0.3s ease;
        }

        .card-login:hover .logo-img {
            transform: scale(1.03);
        }

        /* Forzamos el color de los placeholders para que se lean bien en la oscuridad */
        .form-control::placeholder {
            color: #6c757d !important;
            opacity: 1;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100" style="background: radial-gradient(circle at center, #14141f 0%, #0b0b0e 100%) !important;">

    <div class="container d-flex justify-content-center px-3">
        <div class="card card-custom p-4 shadow-lg card-login">
            <div class="text-center mb-4">
                <!-- Contenedor del Logo sin recuadro feo -->
                <div class="logo-container">
                    <img src="logo.png" alt="Mr. John's Logo" class="logo-img">
                </div>
                <!-- Cambiado a text-light-50 para máxima legibilidad -->
                <p class="text-white-50 small">Ingresá tus credenciales para acceder al sistema</p>
            </div>
            
            <!-- Formulario del Login -->
            <form id="formLogin">
                <div class="mb-3">
                    <!-- Cambiado a text-light -->
                    <label for="username" class="form-label text-light small fw-semibold">Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-light"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control bg-dark text-light border-secondary" id="username" placeholder="" required>
                    </div>
                </div>
                
                <div class="mb-4">
                    <!-- Cambiado a text-light -->
                    <label for="password" class="form-label text-light small fw-semibold">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-light"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control bg-dark text-light border-secondary" id="password" placeholder="" required>
                    </div>
                </div>
                
                <button type="submit" id="btn-login-submit" class="btn btn-custom w-100 py-2 shadow-sm text-dark">
                    ENTRAR
                </button>
            </form>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Tu lógica de login existente -->
    <script src="login.js"></script>
</body>
</html>
